<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Produtos</title>
</head>
<body>
    <h1>Produtos Cadastrados</h1>
    
    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Descrição</th>
            </tr>
        </thead>
        <tbody>

            <tr th:each="product : ${productsList}">
                <td th:text="${product.name}">Nome do produto aqui</td>
                <td th:text="${product.description}">Descrição aqui</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
